name: Build PonyNotes Android

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo"
        required: true
        default: "PonyNotes-IO/PonyNotes-New"
      branch:
        description: "Branch"
        required: true
        default: "dev_mobile_new"
      build_name:
        description: "Build Version (it should match the version in pubspec.yaml)"
        required: true
        default: "1.2.5"
      build_number:
        description: "Build Number (it should be unique)"
        required: true
        default: "51"
      build_type:
        type: choice
        description: "Build Type"
        required: true
        options:
          - "apk"
          - "appbundle"
      internal_build:
        type: choice
        description: "Internal Build Type (1 for internal, 0 for external)"
        required: true
        default: "1"
        options:
          - "0"
          - "1"
  workflow_call:
    inputs:
      repo:
        description: "Repo"
        required: true
        type: string
      branch:
        description: "Branch"
        required: true
        type: string
      build_name:
        description: "Build Version"
        required: true
        type: string
      build_number:
        description: "Build Number"
        required: true
        type: string
      build_type:
        description: "Build Type"
        required: true
        type: string
      internal_build:
        description: "Internal Build Type"
        required: true
        type: string
      upload_url:
        description: "Upload URL for release assets"
        required: false
        type: string

env:
  FLUTTER_VERSION: "3.35.0"
  RUST_TOOLCHAIN: "1.91.0"

jobs:
  # ============================================================
  # arm64 job: 仅 arm64-v8a
  # ============================================================
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ANDROID_APK_NAME: PonyNotes-${{ inputs.build_name }}-android-arm64

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"

      - name: Checkout source code
        uses: actions/checkout@v2
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Download PonyNotes-Cloud-New (for client-api dependency)
        run: |
          TARGET_DIR="${GITHUB_WORKSPACE}/../PonyNotes-Cloud-New"
          curl -sL https://github.com/PonyNotes-IO/PonyNotes-Cloud-New/archive/refs/heads/main.tar.gz -o /tmp/cloud.tar.gz
          tar -xzf /tmp/cloud.tar.gz -C /tmp 2>/dev/null || true
          rm -f /tmp/PonyNotes-Cloud-New-main/nginx.conf
          rm -rf /tmp/PonyNotes-Cloud-New-main/nginx
          mv /tmp/PonyNotes-Cloud-New-main "$TARGET_DIR"
          rm /tmp/cloud.tar.gz

      - name: Download AppFlowy-Collab (for collab dependencies)
        run: |
          TARGET_DIR="${GITHUB_WORKSPACE}/../AppFlowy-Collab"
          curl -sL https://github.com/PonyNotes-IO/AppFlowy-Collab/archive/refs/heads/dev.tar.gz -o /tmp/collab.tar.gz
          mkdir -p "$TARGET_DIR"
          tar -xzf /tmp/collab.tar.gz -C /tmp 2>/dev/null || true
          mv /tmp/AppFlowy-Collab-dev/* "$TARGET_DIR/"
          rm -rf /tmp/AppFlowy-Collab-dev /tmp/collab.tar.gz

      - name: Download rust-rocksdb (for rocksdb dependency)
        run: |
          TARGET_DIR="${GITHUB_WORKSPACE}/../rust-rocksdb"
          git clone https://github.com/rust-rocksdb/rust-rocksdb.git "$TARGET_DIR"
          cd "$TARGET_DIR"
          git checkout 1710120e4549e04ba3baa6a1ee5a5a801fa45a72
          git submodule update --init --recursive --depth 1

      - name: Download langchain-rust (for langchain-rust dependency)
        run: |
          TARGET_DIR="${GITHUB_WORKSPACE}/../langchain-rust"
          curl -sL https://github.com/appflowy/langchain-rust/archive/refs/heads/af.tar.gz -o /tmp/langchain.tar.gz
          mkdir -p "$TARGET_DIR"
          tar -xzf /tmp/langchain.tar.gz -C /tmp 2>/dev/null || true
          mv /tmp/langchain-rust-af/* "$TARGET_DIR/"
          rm -rf /tmp/langchain-rust-af /tmp/langchain.tar.gz

      - name: Patch Cargo.toml to use local paths for git dependencies
        run: |
          CARGO_TOML="${GITHUB_WORKSPACE}/frontend/rust-lib/Cargo.toml"
          cp "$CARGO_TOML" "$CARGO_TOML.bak"
          for c in collab collab-entity collab-folder collab-document collab-database collab-plugins collab-user; do
            sed -i "s|^${c} = { version = \"0.2\", git = \"https://github.com/PonyNotes-IO/AppFlowy-Collab\", branch = \"dev\" }|${c} = { path = \"../../../AppFlowy-Collab/${c}\" }|g" "$CARGO_TOML"
          done
          sed -i 's|^collab-importer = { version = "0.1", git = "https://github.com/PonyNotes-IO/AppFlowy-Collab", branch = "dev" }|collab-importer = { path = "../../../AppFlowy-Collab/collab-importer" }|g' "$CARGO_TOML"
          sed -i 's|^rocksdb = { git = "https://github.com/rust-rocksdb/rust-rocksdb", rev = "1710120e4549e04ba3baa6a1ee5a5a801fa45a72" }|rocksdb = { path = "../../../rust-rocksdb" }|g' "$CARGO_TOML"
          sed -i 's|^langchain-rust = { version = "4.6.0", git = "https://github.com/appflowy/langchain-rust", branch = "af" }|langchain-rust = { path = "../../../langchain-rust" }|g' "$CARGO_TOML"
          if grep -nE '^(collab[a-z-]*|rocksdb|langchain-rust) = .*git = ' "$CARGO_TOML"; then
            echo "❌ 残留 git 依赖"; exit 1
          fi

      - name: Strip Windows-only Android linker config
        run: |
          CFG="${GITHUB_WORKSPACE}/frontend/rust-lib/.cargo/config.toml"
          [ ! -f "$CFG" ] && exit 0
          awk '/^\[/ { skip = ($0 ~ /^\[target\.[a-z0-9_]+-linux-android[a-z]*\]/) } !skip' "$CFG" > "$CFG.new"
          mv "$CFG.new" "$CFG"

      - name: Strip machine-specific java.home
        run: |
          GP="${GITHUB_WORKSPACE}/frontend/appflowy_flutter/android/gradle.properties"
          [ ! -f "$GP" ] && exit 0
          sed -i '/^org\.gradle\.java\.home=/d' "$GP"

      - name: Build Rust in release profile (arm64 only)
        run: |
          MT="${GITHUB_WORKSPACE}/frontend/scripts/makefile/mobile.toml"
          sed -i 's|-o ./jniLibs build --package dart-ffi|-o ./jniLibs build --release --package dart-ffi|' "$MT"
          sed -i 's|cargo ndk -t arm64-v8a -t armeabi-v7a -o ./jniLibs|cargo ndk -t arm64-v8a -o ./jniLibs|' "$MT"

      - name: Restrict ABIs to arm64-v8a
        run: |
          BG="${GITHUB_WORKSPACE}/frontend/appflowy_flutter/android/app/build.gradle"
          python3 - "$BG" "arm64" <<'PY'
          import sys, re
          p, arch = sys.argv[1], sys.argv[2]
          s = open(p, encoding='utf-8').read()
          if re.search(r'splits\s*\{\s*abi\s*\{[^}]*enable\s+true', s):
              s = re.sub(r'(splits\s*\{\s*abi\s*\{[^}]*?)enable\s+true', r'\1enable false', s, count=1)
          if 'abiFilters' not in s:
              anchor = '        multiDexEnabled true\n'
              s = s.replace(anchor, anchor + "        ndk {\n            abiFilters 'arm64-v8a'\n        }\n", 1)
          if 'packaging {' not in s:
              anchor2 = '    defaultConfig {'
              block = ("    packaging {\n"
                       "        jniLibs {\n"
                       "            excludes += ['lib/x86/**', 'lib/x86_64/**', 'lib/armeabi-v7a/**']\n"
                       "        }\n"
                       "    }\n\n")
              s = s.replace(anchor2, block + anchor2, 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: aarch64-linux-android
          override: true
          profile: minimal

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: "r26d"
          add-to-path: true

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: android-arm64
          workspaces: |
            frontend/rust-lib

      - uses: davidB/rust-cargo-make@v1
        with:
          version: "0.37.5"

      - name: Install prerequisites
        working-directory: frontend
        run: |
          rustup target install aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install duckscript_cli --force --locked
          cargo install --version 3.3.0 cargo-ndk --locked
          sudo wget -qO /etc/apt/trusted.gpg.d/dart_linux_signing_key.asc https://dl-ssl.google.com/linux/linux_signing_key.pub
          sudo wget -qO /etc/apt/sources.list.d/dart_stable.list https://storage.googleapis.com/download.dartlang.org/linux/debian/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y dart curl build-essential libssl-dev clang cmake ninja-build pkg-config libgtk-3-dev keybinder-3.0 libnotify-dev gcc-multilib libmpv-dev mpv
          cargo make appflowy-flutter-deps-tools
        shell: bash

      - name: Generate env file
        working-directory: frontend/appflowy_flutter
        run: |
          echo "INTERNAL_BUILD=${{ inputs.internal_build }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

      - name: Configure release sign
        working-directory: frontend/appflowy_flutter/android/app
        run: sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' build.gradle

      - name: Configure key.properties
        working-directory: frontend/appflowy_flutter/android
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks
          echo -e "storePassword=${{ secrets.ANDROID_UPLOAD_KEYSTORE_STORE_PASSWORD }}\nkeyPassword=${{ secrets.ANDROID_UPLOAD_KEYSTORE_KEY_PASSWORD }}\nkeyAlias=upload\nstoreFile=upload-keystore.jks" > key.properties

      - name: Configure Git credentials for Cargo
        run: |
          git config --global credential.helper store
          echo "https://${{ secrets.ADMIN_GITHUB_TOKEN }}:x-oauth-basic@github.com" > ~/.git-credentials

      - name: Build PonyNotes (arm64)
        working-directory: frontend
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo make --profile production-android appflowy-core-dev-android-ci
          cargo make --profile production-android code_generation
          ls -lh rust-lib/jniLibs/*/ || true
          CXX_SRC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          CXX_DST="appflowy_flutter/android/app/src/main/jniLibs/arm64-v8a"
          [ -f "$CXX_SRC" ] || { find "${ANDROID_NDK_HOME}" -name libc++_shared.so -path "*aarch64*" | head; exit 1; }
          mkdir -p "$CXX_DST" && cp "$CXX_SRC" "$CXX_DST/"
          cd appflowy_flutter
          flutter build apk --target-platform android-arm64 --build-name ${{ inputs.build_name }} --build-number ${{ inputs.build_number }} --split-debug-info=./debug_info --obfuscate

      - name: Verify APK native libraries
        working-directory: frontend/appflowy_flutter
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BAD=$(unzip -l "$APK" | grep -oE 'lib/(x86|x86_64|armeabi-v7a|armeabi)/' | sort -u)
          [ -z "$BAD" ] || { echo "❌ 多余 ABI: $BAD"; exit 1; }
          READELF="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          SYS=" libc.so libm.so libdl.so liblog.so libandroid.so libz.so libGLESv2.so libGLESv3.so libEGL.so libOpenSLES.so libvulkan.so libjnigraphics.so libmediandk.so libnativewindow.so libaaudio.so libcamera2ndk.so libstdc++.so libneuralnetworks.so libsync.so libamidi.so libnativehelper.so "
          rm -rf /tmp/apkverify && mkdir -p /tmp/apkverify
          unzip -o -q "$APK" 'lib/arm64-v8a/*' -d /tmp/apkverify
          PRESENT=" $(ls /tmp/apkverify/lib/arm64-v8a/ | tr '\n' ' ') "
          FAIL=0
          for so in /tmp/apkverify/lib/arm64-v8a/*.so; do
            for need in $("$READELF" -d "$so" 2>/dev/null | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/'); do
              case "$SYS$PRESENT" in *" $need "*) ;; *) echo "❌ $(basename $so) -> $need"; FAIL=1 ;; esac
            done
          done
          for must in libdart_ffi.so libc++_shared.so libapp.so libflutter.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$must" || { echo "❌ 缺少 $must"; FAIL=1; }
          done
          [ "$FAIL" = "1" ] && exit 1
          echo "✅ arm64 APK 验证通过"

      - name: Rename and upload APK
        run: |
          mv frontend/appflowy_flutter/build/app/outputs/flutter-apk/app-release.apk \
             frontend/appflowy_flutter/build/app/outputs/flutter-apk/${{ env.ANDROID_APK_NAME }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANDROID_APK_NAME }}.apk
          path: frontend/appflowy_flutter/build/app/outputs/flutter-apk/${{ env.ANDROID_APK_NAME }}.apk

      - name: Upload APK to Release
        if: inputs.upload_url != ''
        shell: bash
        run: |
          filename="${{ env.ANDROID_APK_NAME }}.apk"
          filepath="frontend/appflowy_flutter/build/app/outputs/flutter-apk/$filename"
          encoded_filename=$(echo -n "$filename" | jq -sRr @uri)
          upload_url=$(echo "${{ inputs.upload_url }}" | sed 's/{[^}]*}//g')
          curl -L -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$filepath" \
            "${upload_url}?name=${encoded_filename}" --fail-with-body

  # ============================================================
  # universal job: arm64-v8a + armeabi-v7a 兼容包
  # ============================================================
  universal:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      ANDROID_APK_NAME: PonyNotes-${{ inputs.build_name }}-android-universal

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"

      - name: Checkout source code
        uses: actions/checkout@v2
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Download PonyNotes-Cloud-New (for client-api dependency)
        run: |
          TARGET_DIR="${GITHUB_WORKSPACE}/../PonyNotes-Cloud-New"
          curl -sL https://github.com/PonyNotes-IO/PonyNotes-Cloud-New/archive/refs/heads/main.tar.gz -o /tmp/cloud.tar.gz
          tar -xzf /tmp/cloud.tar.gz -C /tmp 2>/dev/null || true
          rm -f /tmp/PonyNotes-Cloud-New-main/nginx.conf
          rm -rf /tmp/PonyNotes-Cloud-New-main/nginx
          mv /tmp/PonyNotes-Cloud-New-main "$TARGET_DIR"
          rm /tmp/cloud.tar.gz

      - name: Download AppFlowy-Collab (for collab dependencies)
        run: |
          TARGET_DIR="${GITHUB_WORKSPACE}/../AppFlowy-Collab"
          curl -sL https://github.com/PonyNotes-IO/AppFlowy-Collab/archive/refs/heads/dev.tar.gz -o /tmp/collab.tar.gz
          mkdir -p "$TARGET_DIR"
          tar -xzf /tmp/collab.tar.gz -C /tmp 2>/dev/null || true
          mv /tmp/AppFlowy-Collab-dev/* "$TARGET_DIR/"
          rm -rf /tmp/AppFlowy-Collab-dev /tmp/collab.tar.gz

      - name: Download rust-rocksdb (for rocksdb dependency)
        run: |
          TARGET_DIR="${GITHUB_WORKSPACE}/../rust-rocksdb"
          git clone https://github.com/rust-rocksdb/rust-rocksdb.git "$TARGET_DIR"
          cd "$TARGET_DIR"
          git checkout 1710120e4549e04ba3baa6a1ee5a5a801fa45a72
          git submodule update --init --recursive --depth 1

      - name: Download langchain-rust (for langchain-rust dependency)
        run: |
          TARGET_DIR="${GITHUB_WORKSPACE}/../langchain-rust"
          curl -sL https://github.com/appflowy/langchain-rust/archive/refs/heads/af.tar.gz -o /tmp/langchain.tar.gz
          mkdir -p "$TARGET_DIR"
          tar -xzf /tmp/langchain.tar.gz -C /tmp 2>/dev/null || true
          mv /tmp/langchain-rust-af/* "$TARGET_DIR/"
          rm -rf /tmp/langchain-rust-af /tmp/langchain.tar.gz

      - name: Patch Cargo.toml to use local paths for git dependencies
        run: |
          CARGO_TOML="${GITHUB_WORKSPACE}/frontend/rust-lib/Cargo.toml"
          cp "$CARGO_TOML" "$CARGO_TOML.bak"
          for c in collab collab-entity collab-folder collab-document collab-database collab-plugins collab-user; do
            sed -i "s|^${c} = { version = \"0.2\", git = \"https://github.com/PonyNotes-IO/AppFlowy-Collab\", branch = \"dev\" }|${c} = { path = \"../../../AppFlowy-Collab/${c}\" }|g" "$CARGO_TOML"
          done
          sed -i 's|^collab-importer = { version = "0.1", git = "https://github.com/PonyNotes-IO/AppFlowy-Collab", branch = "dev" }|collab-importer = { path = "../../../AppFlowy-Collab/collab-importer" }|g' "$CARGO_TOML"
          sed -i 's|^rocksdb = { git = "https://github.com/rust-rocksdb/rust-rocksdb", rev = "1710120e4549e04ba3baa6a1ee5a5a801fa45a72" }|rocksdb = { path = "../../../rust-rocksdb" }|g' "$CARGO_TOML"
          sed -i 's|^langchain-rust = { version = "4.6.0", git = "https://github.com/appflowy/langchain-rust", branch = "af" }|langchain-rust = { path = "../../../langchain-rust" }|g' "$CARGO_TOML"
          if grep -nE '^(collab[a-z-]*|rocksdb|langchain-rust) = .*git = ' "$CARGO_TOML"; then
            echo "❌ 残留 git 依赖"; exit 1
          fi

      - name: Strip Windows-only Android linker config
        run: |
          CFG="${GITHUB_WORKSPACE}/frontend/rust-lib/.cargo/config.toml"
          [ ! -f "$CFG" ] && exit 0
          awk '/^\[/ { skip = ($0 ~ /^\[target\.[a-z0-9_]+-linux-android[a-z]*\]/) } !skip' "$CFG" > "$CFG.new"
          mv "$CFG.new" "$CFG"

      - name: Strip machine-specific java.home
        run: |
          GP="${GITHUB_WORKSPACE}/frontend/appflowy_flutter/android/gradle.properties"
          [ ! -f "$GP" ] && exit 0
          sed -i '/^org\.gradle\.java\.home=/d' "$GP"

      - name: Build Rust in release profile (arm64 + armeabi-v7a)
        run: |
          MT="${GITHUB_WORKSPACE}/frontend/scripts/makefile/mobile.toml"
          sed -i 's|-o ./jniLibs build --package dart-ffi|-o ./jniLibs build --release --package dart-ffi|' "$MT"
          echo "保留双架构: arm64-v8a + armeabi-v7a"

      - name: Restrict ABIs to arm64-v8a + armeabi-v7a
        run: |
          BG="${GITHUB_WORKSPACE}/frontend/appflowy_flutter/android/app/build.gradle"
          python3 - "$BG" "universal" <<'PY'
          import sys, re
          p, arch = sys.argv[1], sys.argv[2]
          s = open(p, encoding='utf-8').read()
          if re.search(r'splits\s*\{\s*abi\s*\{[^}]*enable\s+true', s):
              s = re.sub(r'(splits\s*\{\s*abi\s*\{[^}]*?)enable\s+true', r'\1enable false', s, count=1)
          if 'abiFilters' not in s:
              anchor = '        multiDexEnabled true\n'
              s = s.replace(anchor, anchor + "        ndk {\n            abiFilters 'arm64-v8a', 'armeabi-v7a'\n        }\n", 1)
          if 'packaging {' not in s:
              anchor2 = '    defaultConfig {'
              block = ("    packaging {\n"
                       "        jniLibs {\n"
                       "            excludes += ['lib/x86/**', 'lib/x86_64/**']\n"
                       "        }\n"
                       "    }\n\n")
              s = s.replace(anchor2, block + anchor2, 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: aarch64-linux-android
          override: true
          profile: minimal

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: "r26d"
          add-to-path: true

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: android-universal
          workspaces: |
            frontend/rust-lib

      - uses: davidB/rust-cargo-make@v1
        with:
          version: "0.37.5"

      - name: Install prerequisites
        working-directory: frontend
        run: |
          rustup target install aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install duckscript_cli --force --locked
          cargo install --version 3.3.0 cargo-ndk --locked
          sudo wget -qO /etc/apt/trusted.gpg.d/dart_linux_signing_key.asc https://dl-ssl.google.com/linux/linux_signing_key.pub
          sudo wget -qO /etc/apt/sources.list.d/dart_stable.list https://storage.googleapis.com/download.dartlang.org/linux/debian/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y dart curl build-essential libssl-dev clang cmake ninja-build pkg-config libgtk-3-dev keybinder-3.0 libnotify-dev gcc-multilib libmpv-dev mpv
          cargo make appflowy-flutter-deps-tools
        shell: bash

      - name: Generate env file
        working-directory: frontend/appflowy_flutter
        run: |
          echo "INTERNAL_BUILD=${{ inputs.internal_build }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

      - name: Configure release sign
        working-directory: frontend/appflowy_flutter/android/app
        run: sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' build.gradle

      - name: Configure key.properties
        working-directory: frontend/appflowy_flutter/android
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks
          echo -e "storePassword=${{ secrets.ANDROID_UPLOAD_KEYSTORE_STORE_PASSWORD }}\nkeyPassword=${{ secrets.ANDROID_UPLOAD_KEYSTORE_KEY_PASSWORD }}\nkeyAlias=upload\nstoreFile=upload-keystore.jks" > key.properties

      - name: Configure Git credentials for Cargo
        run: |
          git config --global credential.helper store
          echo "https://${{ secrets.ADMIN_GITHUB_TOKEN }}:x-oauth-basic@github.com" > ~/.git-credentials

      - name: Build PonyNotes (universal)
        working-directory: frontend
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo make --profile production-android appflowy-core-dev-android-ci
          cargo make --profile production-android code_generation
          ls -lh rust-lib/jniLibs/*/ || true
          # arm64 libc++_shared.so
          CXX_SRC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          CXX_DST="appflowy_flutter/android/app/src/main/jniLibs/arm64-v8a"
          [ -f "$CXX_SRC" ] || { find "${ANDROID_NDK_HOME}" -name libc++_shared.so -path "*aarch64*" | head; exit 1; }
          mkdir -p "$CXX_DST" && cp "$CXX_SRC" "$CXX_DST/"
          # armeabi-v7a libc++_shared.so
          CXX_SRC_V7A="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so"
          CXX_DST_V7A="appflowy_flutter/android/app/src/main/jniLibs/armeabi-v7a"
          [ -f "$CXX_SRC_V7A" ] || { find "${ANDROID_NDK_HOME}" -name libc++_shared.so -path "*arm-linux*" | head; exit 1; }
          mkdir -p "$CXX_DST_V7A" && cp "$CXX_SRC_V7A" "$CXX_DST_V7A/"
          ls -lh appflowy_flutter/android/app/src/main/jniLibs/*/
          cd appflowy_flutter
          flutter build apk --target-platform android-arm64,android-arm --build-name ${{ inputs.build_name }} --build-number ${{ inputs.build_number }} --split-debug-info=./debug_info --obfuscate

      - name: Verify APK native libraries
        working-directory: frontend/appflowy_flutter
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BAD=$(unzip -l "$APK" | grep -oE 'lib/(x86|x86_64|armeabi)/' | sort -u)
          [ -z "$BAD" ] || { echo "❌ 多余 ABI: $BAD"; exit 1; }
          READELF="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          SYS=" libc.so libm.so libdl.so liblog.so libandroid.so libz.so libGLESv2.so libGLESv3.so libEGL.so libOpenSLES.so libvulkan.so libjnigraphics.so libmediandk.so libnativewindow.so libaaudio.so libcamera2ndk.so libstdc++.so libneuralnetworks.so libsync.so libamidi.so libnativehelper.so "
          FAIL=0
          for abi in arm64-v8a armeabi-v7a; do
            rm -rf /tmp/apkverify && mkdir -p /tmp/apkverify
            unzip -o -q "$APK" "lib/${abi}/*" -d /tmp/apkverify 2>/dev/null || continue
            PRESENT=" $(ls /tmp/apkverify/lib/${abi}/ | tr '\n' ' ') "
            for so in /tmp/apkverify/lib/${abi}/*.so; do
              for need in $("$READELF" -d "$so" 2>/dev/null | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/'); do
                case "$SYS$PRESENT" in *" $need "*) ;; *) echo "❌ $(basename $so) -> $need ($abi)"; FAIL=1 ;; esac
              done
            done
            for must in libdart_ffi.so libc++_shared.so libapp.so libflutter.so; do
              unzip -l "$APK" | grep -q "lib/${abi}/$must" || { echo "❌ 缺少 lib/${abi}/$must"; FAIL=1; }
            done
          done
          [ "$FAIL" = "1" ] && exit 1
          echo "✅ universal APK 验证通过"

      - name: Rename and upload APK
        run: |
          mv frontend/appflowy_flutter/build/app/outputs/flutter-apk/app-release.apk \
             frontend/appflowy_flutter/build/app/outputs/flutter-apk/${{ env.ANDROID_APK_NAME }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANDROID_APK_NAME }}.apk
          path: frontend/appflowy_flutter/build/app/outputs/flutter-apk/${{ env.ANDROID_APK_NAME }}.apk

      - name: Upload APK to Release
        if: inputs.upload_url != ''
        shell: bash
        run: |
          filename="${{ env.ANDROID_APK_NAME }}.apk"
          filepath="frontend/appflowy_flutter/build/app/outputs/flutter-apk/$filename"
          encoded_filename=$(echo -n "$filename" | jq -sRr @uri)
          upload_url=$(echo "${{ inputs.upload_url }}" | sed 's/{[^}]*}//g')
          curl -L -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$filepath" \
            "${upload_url}?name=${encoded_filename}" --fail-with-body
