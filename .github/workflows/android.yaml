name: Build PonyNotes Android

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo"
        required: true
        default: "PonyNotes-IO/PonyNotes"
      branch:
        description: "Branch"
        required: true
        default: "main"
      build_name:
        description: "Build Version (it should match the version in pubspec.yaml)"
        required: true
        default: "0.9.4"
      build_number:
        description: "Build Number (it should be unique)"
        required: true
        default: "2909401"
      build_type:
        type: choice
        description: "Build Type"
        required: true
        options:
          - "apk"
          - "appbundle"
      internal_build:
        type: choice
        description: "Internal Build Type (1 for internal, 0 for external)"
        required: true
        default: "1"
        options:
          - "0"
          - "1"
  workflow_call:
    inputs:
      repo:
        description: "Repo"
        required: true
        type: string
      branch:
        description: "Branch"
        required: true
        type: string
      build_name:
        description: "Build Version"
        required: true
        type: string
      build_number:
        description: "Build Number"
        required: true
        type: string
      build_type:
        description: "Build Type"
        required: true
        type: string
      internal_build:
        description: "Internal Build Type"
        required: true
        type: string
      upload_url:
        description: "Upload URL for release assets"
        required: false
        type: string

env:
  FLUTTER_VERSION: "3.35.0"
  RUST_TOOLCHAIN: "1.91.0"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
    runs-on: ${{ matrix.os }}

    steps:
      # the following step is required to avoid running out of space
      - name: Maximize build space
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout source code
        uses: actions/checkout@v2
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      # 以下依赖准备步骤与 macos.yaml / windows.yaml 保持一致：
      # frontend/rust-lib/Cargo.toml 用相对路径 ../../../ 引用这些同级仓库，
      # 缺任何一个都会在 cargo metadata 阶段直接失败。
      # 注意：本 job 跑在 ubuntu 上，sed 必须用 GNU 语法（sed -i），
      # 不能照抄 macos.yaml 里的 BSD 语法（sed -i ''）。
      - name: Download PonyNotes-Cloud-New (for client-api dependency)
        run: |
          echo "📦 Downloading PonyNotes-Cloud-New via tarball..."
          TARGET_DIR="${GITHUB_WORKSPACE}/../PonyNotes-Cloud-New"
          curl -sL https://github.com/PonyNotes-IO/PonyNotes-Cloud-New/archive/refs/heads/main.tar.gz -o /tmp/cloud.tar.gz
          tar -xzf /tmp/cloud.tar.gz -C /tmp 2>/dev/null || true
          rm -f /tmp/PonyNotes-Cloud-New-main/nginx.conf
          rm -rf /tmp/PonyNotes-Cloud-New-main/nginx
          mv /tmp/PonyNotes-Cloud-New-main "$TARGET_DIR"
          rm /tmp/cloud.tar.gz
          echo "✅ Downloaded to: $TARGET_DIR"
          ls -la "$TARGET_DIR/Cargo.toml"
          ls -la "$TARGET_DIR/libs/client-api/src/"

      - name: Download AppFlowy-Collab (for collab dependencies)
        run: |
          echo "📦 Downloading AppFlowy-Collab (dev branch) via tarball..."
          TARGET_DIR="${GITHUB_WORKSPACE}/../AppFlowy-Collab"
          curl -sL https://github.com/PonyNotes-IO/AppFlowy-Collab/archive/refs/heads/dev.tar.gz -o /tmp/collab.tar.gz
          mkdir -p "$TARGET_DIR"
          tar -xzf /tmp/collab.tar.gz -C /tmp 2>/dev/null || true
          mv /tmp/AppFlowy-Collab-dev/* "$TARGET_DIR/"
          rm -rf /tmp/AppFlowy-Collab-dev
          rm /tmp/collab.tar.gz
          echo "✅ AppFlowy-Collab downloaded to: $TARGET_DIR"

      - name: Download rust-rocksdb (for rocksdb dependency)
        run: |
          echo "📦 Cloning rust-rocksdb with submodules (required for rocksdb source)..."
          TARGET_DIR="${GITHUB_WORKSPACE}/../rust-rocksdb"
          git clone https://github.com/rust-rocksdb/rust-rocksdb.git "$TARGET_DIR"
          cd "$TARGET_DIR"
          git checkout 1710120e4549e04ba3baa6a1ee5a5a801fa45a72
          git submodule update --init --recursive --depth 1
          echo "✅ rust-rocksdb cloned to: $TARGET_DIR"

      - name: Download langchain-rust (for langchain-rust dependency)
        run: |
          echo "📦 Downloading langchain-rust (af branch) via tarball..."
          TARGET_DIR="${GITHUB_WORKSPACE}/../langchain-rust"
          curl -sL https://github.com/appflowy/langchain-rust/archive/refs/heads/af.tar.gz -o /tmp/langchain.tar.gz
          mkdir -p "$TARGET_DIR"
          tar -xzf /tmp/langchain.tar.gz -C /tmp 2>/dev/null || true
          mv /tmp/langchain-rust-af/* "$TARGET_DIR/"
          rm -rf /tmp/langchain-rust-af
          rm /tmp/langchain.tar.gz
          echo "✅ langchain-rust downloaded to: $TARGET_DIR"

      - name: Patch Cargo.toml to use local paths for git dependencies
        run: |
          echo "🔧 Patching Cargo.toml to use local paths instead of git URLs..."
          CARGO_TOML="${GITHUB_WORKSPACE}/frontend/rust-lib/Cargo.toml"
          cp "$CARGO_TOML" "$CARGO_TOML.bak"

          for c in collab collab-entity collab-folder collab-document collab-database collab-plugins collab-user; do
            sed -i "s|^${c} = { version = \"0.2\", git = \"https://github.com/PonyNotes-IO/AppFlowy-Collab\", branch = \"dev\" }|${c} = { path = \"../../../AppFlowy-Collab/${c}\" }|g" "$CARGO_TOML"
          done
          sed -i 's|^collab-importer = { version = "0.1", git = "https://github.com/PonyNotes-IO/AppFlowy-Collab", branch = "dev" }|collab-importer = { path = "../../../AppFlowy-Collab/collab-importer" }|g' "$CARGO_TOML"
          sed -i 's|^rocksdb = { git = "https://github.com/rust-rocksdb/rust-rocksdb", rev = "1710120e4549e04ba3baa6a1ee5a5a801fa45a72" }|rocksdb = { path = "../../../rust-rocksdb" }|g' "$CARGO_TOML"
          sed -i 's|^langchain-rust = { version = "4.6.0", git = "https://github.com/appflowy/langchain-rust", branch = "af" }|langchain-rust = { path = "../../../langchain-rust" }|g' "$CARGO_TOML"

          echo "✅ Cargo.toml patched，校验是否仍有残留 git 依赖："
          if grep -nE '^(collab[a-z-]*|rocksdb|langchain-rust) = .*git = ' "$CARGO_TOML"; then
            echo "❌ 上述依赖未被替换成本地路径，patch 规则与 Cargo.toml 已不匹配，提前失败以免浪费构建时间。"
            exit 1
          fi
          echo "📋 [patch.crates-io] 区："
          grep -A 35 '\[patch.crates-io\]' "$CARGO_TOML" | head -45

      # frontend/rust-lib/.cargo/config.toml 里的 [target.*-linux-android] 两段
      # 把 linker 与 --sysroot 硬编码成了某台 Windows 机器的 D:/Android/... 路径
      # （上游 AppFlowy 该文件并无 android 段，是本地调试配置误入库）。
      # cargo-ndk 会通过环境变量覆盖 linker，但 rustflags 里的 --sysroot 覆盖不掉，
      # 于是链接阶段带着一个 Linux 上不存在的 sysroot，必然失败。
      # 构建实际走 `cargo ndk -t ...`，NDK 的 linker/sysroot 由 cargo-ndk 自行注入，
      # 因此这里直接把这两段剥掉即可，且只作用于 CI 检出的副本。
      - name: Strip Windows-only Android linker config from .cargo/config.toml
        run: |
          CFG="${GITHUB_WORKSPACE}/frontend/rust-lib/.cargo/config.toml"
          if [ ! -f "$CFG" ]; then
            echo "ℹ️ 无 $CFG，跳过"
            exit 0
          fi
          echo "🔧 剥离前含 D:/Android 的行数：$(grep -c 'D:/Android' "$CFG" || true)"
          # 每遇到一个 [段头] 就重新判定是否跳过；非段头行沿用当前状态。
          awk '/^\[/ { skip = ($0 ~ /^\[target\.[a-z0-9_]+-linux-android[a-z]*\]/) } !skip' \
            "$CFG" > "$CFG.new"
          mv "$CFG.new" "$CFG"
          if grep -n "D:/Android" "$CFG"; then
            echo "❌ 仍残留 Windows 路径，剥离规则失效"
            exit 1
          fi
          echo "✅ 已剥离，剩余内容："
          cat "$CFG"

      # android/gradle.properties 里的 org.gradle.java.home 指向
      # /Applications/Android Studio.app/...（某台 macOS 机器上的 JBR），
      # 上游 AppFlowy 该文件并无此项。Linux runner 上这个路径不存在，
      # Gradle 直接报 "Java home supplied is invalid"。
      # 删掉后 Gradle 会用 setup-java 设定的 JAVA_HOME。同样只作用于 CI 副本。
      - name: Strip machine-specific java.home from gradle.properties
        run: |
          GP="${GITHUB_WORKSPACE}/frontend/appflowy_flutter/android/gradle.properties"
          if [ ! -f "$GP" ]; then
            echo "ℹ️ 无 $GP，跳过"
            exit 0
          fi
          sed -i '/^org\.gradle\.java\.home=/d' "$GP"
          if grep -n "org.gradle.java.home" "$GP"; then
            echo "❌ 仍残留 java.home 设置"
            exit 1
          fi
          echo "✅ 已剥离，剩余内容："
          cat "$GP"

      # sdk-build-android-ci 的 cargo ndk 没带 --release，打出来的是 debug 产物：
      # libdart_ffi.so 单是 arm64 就 120 MB，整包 171 MB（安装后 419 MB）。
      # production-android profile 里 BUILD_FLAG 本就是 release，此处补齐即可。
      # cargo-ndk 对 release 产物默认会 strip。
      - name: Build Rust in release profile
        run: |
          MT="${GITHUB_WORKSPACE}/frontend/scripts/makefile/mobile.toml"
          sed -i 's|-o ./jniLibs build --package dart-ffi|-o ./jniLibs build --release --package dart-ffi|' "$MT"
          echo "sdk-build-android-ci 的构建命令："
          grep -A6 '^\[tasks.sdk-build-android-ci\]' "$MT" | grep "cargo ndk"
          if ! grep -A6 '^\[tasks.sdk-build-android-ci\]' "$MT" | grep -q -- "--release"; then
            echo "❌ --release 未注入成功，构建命令可能已变更"
            exit 1
          fi
          echo "✅ 已切换为 release profile"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: "17"

      - name: Install Rust toolchain
        id: rust_toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          override: true
          profile: minimal

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: "r26d"
          add-to-path: true

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.os }}
          workspaces: |
            frontend/rust-lib

      - uses: davidB/rust-cargo-make@v1
        with:
          version: "0.37.5"

      - name: Install prerequisites
        working-directory: frontend
        run: |
          # sdk-build-android-ci 构建 arm64-v8a + armeabi-v7a；
          # x86_64 一并装上，以免任务链改动时再次踩 "can't find crate for core"。
          rustup target install aarch64-linux-android
          rustup target install armv7-linux-androideabi
          rustup target install x86_64-linux-android
          rustup target list --installed | grep android
          cargo install duckscript_cli --force --locked
          cargo install --version 3.3.0 cargo-ndk --locked
          sudo wget -qO /etc/apt/trusted.gpg.d/dart_linux_signing_key.asc https://dl-ssl.google.com/linux/linux_signing_key.pub
          sudo wget -qO /etc/apt/sources.list.d/dart_stable.list https://storage.googleapis.com/download.dartlang.org/linux/debian/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y dart curl build-essential libssl-dev clang cmake ninja-build pkg-config libgtk-3-dev
          sudo apt-get install keybinder-3.0 libnotify-dev
          sudo apt-get install gcc-multilib
          sudo apt-get -y install libmpv-dev mpv
          cargo make appflowy-flutter-deps-tools
        shell: bash

      - name: Generate env file
        working-directory: frontend/appflowy_flutter
        run: |
          echo "INTERNAL_BUILD=${{ inputs.internal_build }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
        shell: bash

      - name: Configure release sign
        working-directory: frontend/appflowy_flutter/android/app
        run: |
          # replace signingConfig signingConfigs.debug with signingConfig signingConfigs.release
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' build.gradle

      - name: Configure key.properties
        working-directory: frontend/appflowy_flutter/android
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks
          echo -e "storePassword=${{ secrets.ANDROID_UPLOAD_KEYSTORE_STORE_PASSWORD }}\nkeyPassword=${{ secrets.ANDROID_UPLOAD_KEYSTORE_KEY_PASSWORD }}\nkeyAlias=upload\nstoreFile=upload-keystore.jks" > key.properties
        shell: bash

      - name: Configure Git credentials for Cargo
        run: |
          git config --global credential.helper store
          echo "https://${{ secrets.ADMIN_GITHUB_TOKEN }}:x-oauth-basic@github.com" > ~/.git-credentials

      - name: Build PonyNotes
        working-directory: frontend
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # 用 -ci 任务链，不要用 appflowy-core-dev-android：
          # 后者的 post-mobile-android-multiarch 调 powershell 跑 copy_android_libs.ps1，
          # 该脚本是 Windows 专用（NDK 路径硬编码 D:\Android\...），Linux 上必然失败。
          # -ci 链走跨平台的 post-mobile-android（duckscript 拷贝），
          # 是仓库本来就为 CI 准备好的路径。
          cargo make --profile production-android appflowy-core-dev-android-ci
          cargo make --profile production-android code_generation

          echo "📋 编译出的 Rust 库："
          ls -lh rust-lib/jniLibs/*/ || true

          cd appflowy_flutter
          # --target-platform 必须与上面 sdk-build-android-ci 实际编译的 ABI 一致。
          # 该任务只编 arm64-v8a + armeabi-v7a，而 flutter/mpv/pdfium 等插件自带
          # x86_64 版本，不加限制的话 APK 会声明支持 x86_64 却缺少 libdart_ffi.so，
          # 在 x86_64 设备与模拟器上一启动就崩。
          if [ ${{ inputs.build_type }} = "apk" ]; then
            flutter build apk --target-platform android-arm64,android-arm --build-name ${{ inputs.build_name }} --build-number ${{ inputs.build_number }} --split-debug-info=./debug_info --obfuscate
          elif [ ${{ inputs.build_type }} = "appbundle" ]; then
            flutter build appbundle --target-platform android-arm64,android-arm --build-name ${{ inputs.build_name }} --build-number ${{ inputs.build_number }} --split-debug-info=./debug_info --obfuscate
          fi

      - name: Compress debug symbols
        working-directory: frontend/appflowy_flutter
        run: |
          tar -czf debug-symbols.tar.gz debug_info

      - name: Rename APK
        if: inputs.build_type == 'apk'
        run: |
          mv frontend/appflowy_flutter/build/app/outputs/flutter-apk/app-release.apk frontend/appflowy_flutter/build/app/outputs/flutter-apk/PonyNotes-${{ inputs.build_name }}-android.apk
        shell: bash

      - name: Upload APK
        if: inputs.build_type == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: PonyNotes-${{ inputs.build_name }}-android-apk
          path: frontend/appflowy_flutter/build/app/outputs/flutter-apk/PonyNotes-${{ inputs.build_name }}-android.apk

      - name: Rename AAB
        if: inputs.build_type == 'appbundle'
        run: |
          mv frontend/appflowy_flutter/build/app/outputs/bundle/release/app-release.aab frontend/appflowy_flutter/build/app/outputs/bundle/release/PonyNotes-${{ inputs.build_name }}.aab
        shell: bash

      - name: Upload AAB
        if: inputs.build_type == 'appbundle'
        uses: actions/upload-artifact@v4
        with:
          name: PonyNotes-${{ inputs.build_name }}-android-aab
          path: frontend/appflowy_flutter/build/app/outputs/bundle/release/PonyNotes-${{ inputs.build_name }}.aab

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: PonyNotes-${{ inputs.build_name }}-android-${{ inputs.build_type }}-debug-symbols
          path: frontend/appflowy_flutter/debug-symbols.tar.gz

      - name: Upload APK to Release
        if: inputs.build_type == 'apk' && inputs.upload_url != ''
        run: |
          filename="PonyNotes-${{ inputs.build_name }}-android.apk"
          filepath="frontend/appflowy_flutter/build/app/outputs/flutter-apk/$filename"
          
          # URL encode the filename
          encoded_filename=$(echo -n "$filename" | jq -sRr @uri)
          
          # Remove the {?name,label} template from upload URL if present
          upload_url=$(echo "${{ inputs.upload_url }}" | sed 's/{[^}]*}//g')
          
          echo "Uploading $filename to release..."
          
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$filepath" \
            "${upload_url}?name=${encoded_filename}" \
            --fail-with-body

      - name: Upload AAB to Release
        if: inputs.build_type == 'appbundle' && inputs.upload_url != ''
        run: |
          filename="PonyNotes-${{ inputs.build_name }}.aab"
          filepath="frontend/appflowy_flutter/build/app/outputs/bundle/release/$filename"
          
          # URL encode the filename
          encoded_filename=$(echo -n "$filename" | jq -sRr @uri)
          
          # Remove the {?name,label} template from upload URL if present
          upload_url=$(echo "${{ inputs.upload_url }}" | sed 's/{[^}]*}//g')
          
          echo "Uploading $filename to release..."
          
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$filepath" \
            "${upload_url}?name=${encoded_filename}" \
            --fail-with-body


